# ========================================
# GitLab CI/CD - Build & Push Docker Images
# ========================================
stages:
  - build_frontend
  - build_backend

# Default variables (override in GitLab CI/CD UI or .gitlab-ci.yml include)
variables:
  REPOSITORY: "Orbita"
  MAJOR: "2"
  MINOR: "1"
  PATCH: "5"
  FRONTEND_TYPE: "Blazor"   # [Angular | Blazor | ASP.NET]
  IMAGE_TAG: "${MAJOR}.${MINOR}.${PATCH}"
  ACR_REGISTRY: "$AZURE_CONTAINER_REGISTRY"

# ========================================
# ðŸš€ Build Frontend Stage
# ========================================
build-frontend:
  stage: build_frontend
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  variables:
    DOCKER_DRIVER: overlay2
  script:
    - echo ">> Detecting frontend type: $FRONTEND_TYPE"

    - |
      if [ "$FRONTEND_TYPE" = "Angular" ]; then
        DOCKERFILE_PATH="sources/front/OrbitaFront.Angular/Dockerfile"
        BUILD_CONTEXT="sources/front/OrbitaFront.Angular"
      elif [ "$FRONTEND_TYPE" = "Blazor" ]; then
        DOCKERFILE_PATH="sources/front/OrbitaFront.Blazor/Client/Dockerfile"
        BUILD_CONTEXT="sources/front/OrbitaFront.Blazor"
      else
        DOCKERFILE_PATH="sources/front/OrbitaFront.ASPNET/Dockerfile"
        BUILD_CONTEXT="sources/front/OrbitaFront.ASPNET"
      fi

      IMAGE_NAME="${REPOSITORY}-frontend-$(echo $FRONTEND_TYPE | tr '[:upper:]' '[:lower:]')"

      echo "ðŸ³ Building and pushing $IMAGE_NAME:$IMAGE_TAG"
      docker login $ACR_REGISTRY -u $ACR_USERNAME -p $ACR_PASSWORD
      docker build -t $ACR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG -t $ACR_REGISTRY/$IMAGE_NAME:latest -f $DOCKERFILE_PATH $BUILD_CONTEXT
      docker push $ACR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG
      docker push $ACR_REGISTRY/$IMAGE_NAME:latest

      echo "{ \"frontend\": \"$IMAGE_NAME:$IMAGE_TAG\" }" > frontend-image.json

  artifacts:
    name: "frontend-image"
    paths:
      - frontend-image.json
    expire_in: 7 days

# ========================================
# ðŸš€ Build Backend Stage
# ========================================
build-backend:
  stage: build_backend
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  variables:
    DOCKER_DRIVER: overlay2
  script:
    - docker login $ACR_REGISTRY -u $ACR_USERNAME -p $ACR_PASSWORD

    # API
    - docker build -t $ACR_REGISTRY/${REPOSITORY}-api:$IMAGE_TAG -t $ACR_REGISTRY/${REPOSITORY}-api:latest -f sources/back/Orbita.Api/Dockerfile sources/back/Orbita.Api
    - docker push $ACR_REGISTRY/${REPOSITORY}-api:$IMAGE_TAG
    - docker push $ACR_REGISTRY/${REPOSITORY}-api:latest

    # Consumer
    - docker build -t $ACR_REGISTRY/${REPOSITORY}-consumer:$IMAGE_TAG -t $ACR_REGISTRY/${REPOSITORY}-consumer:latest -f sources/back/Orbita.Backend/Consumer/Dockerfile sources/back/Orbita.Backend/Consumer
    - docker push $ACR_REGISTRY/${REPOSITORY}-consumer:$IMAGE_TAG
    - docker push $ACR_REGISTRY/${REPOSITORY}-consumer:latest

    # Save JSON artifact
    - |
      echo "{ 
        \"api\": \"${REPOSITORY}-api:$IMAGE_TAG\",
        \"consumer\": \"${REPOSITORY}-consumer:$IMAGE_TAG\"
      }" > backend-images.json

  artifacts:
    name: "backend-images"
    paths:
      - backend-images.json
    expire_in: 7 days
