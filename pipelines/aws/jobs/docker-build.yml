jobs:
- job: docker-build
  displayName: "ðŸ³ Docker Build & Push"
  dependsOn: terraform-apply
  pool:
    vmImage: 'ubuntu-latest'

  parameters:
    repository: ""   # âœ… Passed from pipeline parameters

  steps:
    # ---------------------------
    # âœ… Login to AWS ECR
    # ---------------------------
    - task: Docker@2
      displayName: "Login to AWS ECR"
      inputs:
        command: login
        containerRegistry: "$(awsEcrRegistry)"   # âœ… Service connection to ECR

    # ---------------------------
    # âœ… Build Docker Image
    # ---------------------------
    - task: Docker@2
      displayName: "Build Docker Image"
      inputs:
        command: build
        repository: "${{ parameters.repository }}"  # âœ… Use pipeline param
        dockerfile: "sources/back/Orbita.Api/Dockerfile"
        buildContext: "sources/back/Orbita.Api"
        tags: |
          $(Build.BuildId)          # Unique build ID
          latest                    # Optional: keep a rolling "latest" tag

    # ---------------------------
    # âœ… Push Docker Image
    # ---------------------------
    - task: Docker@2
      displayName: "Push Docker Image to AWS ECR"
      inputs:
        command: push
        repository: "${{ parameters.repository }}"
        tags: |
          $(Build.BuildId)
          latest
