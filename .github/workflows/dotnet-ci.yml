name: .NET CI

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Restore, build, and execute all test suites
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore Orbita.slnx

      - name: Build Release
        run: dotnet build Orbita.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test Tests/Orbita.Testing.Unit/Orbita.Testing.Unit.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=normal"

      - name: Run PostgreSQL integration tests
        run: dotnet test Tests/Orbita.Testing.Integration/Orbita.Testing.Integration.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=normal"

      - name: Run architecture tests
        run: dotnet test Tests/Orbita.Testing/Orbita.Testing.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=normal"

      - name: Run architectural tribunals
        run: dotnet test Tests/Orbita.Testing.ArchitecturalReports/Orbita.Testing.ArchitecturalReports.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=normal"
