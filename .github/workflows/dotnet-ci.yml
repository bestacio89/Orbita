name: .NET CI

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Restore, build, and execute all test suites
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore Orbita.slnx

      - name: Build Release
        run: dotnet build Orbita.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test Tests/Orbita.Testing.Unit/Orbita.Testing.Unit.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=normal"

      - name: Run PostgreSQL integration tests
        run: dotnet test Tests/Orbita.Testing.Integration/Orbita.Testing.Integration.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=normal"

      - name: Run architecture tests
        run: dotnet test Tests/Orbita.Testing/Orbita.Testing.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=normal"

      - name: Run architectural tribunals
        run: dotnet test Tests/Orbita.Testing.ArchitecturalReports/Orbita.Testing.ArchitecturalReports.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=normal"

      # Temporary migration-generation probe. The generated diff is reviewed before
      # any migration is committed; this step is removed after the reviewed files land.
      - name: Generate PostgreSQL schema migration preview
        run: |
          dotnet tool install dotnet-ef --tool-path "$RUNNER_TEMP/dotnet-tools" --version 10.0.14
          "$RUNNER_TEMP/dotnet-tools/dotnet-ef" migrations add OrbitaSchemaTranslation --project sources/back/Orbita.Persistence/Orbita.Persistence.csproj --startup-project sources/back/Orbita.API/Orbita.API.csproj --output-dir Migrations --no-build

      - name: Upload PostgreSQL migration preview
        uses: actions/upload-artifact@v4
        with:
          name: orbita-postgresql-migration-preview
          path: |
            sources/back/Orbita.Persistence/Migrations/*OrbitaSchemaTranslation*.cs
            sources/back/Orbita.Persistence/Migrations/ApplicationDbContextModelSnapshot.cs
          if-no-files-found: error
          retention-days: 3
