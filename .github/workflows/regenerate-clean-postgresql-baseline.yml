name: Regenerate clean PostgreSQL baseline

on:
  push:
    branches:
      - feature/backend-domain-contracts
    paths:
      - .github/workflows/regenerate-clean-postgresql-baseline.yml

permissions:
  contents: write

jobs:
  regenerate:
    name: Generate and validate clean EF Core baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install EF Core tooling
        run: dotnet tool install --global dotnet-ef --version 10.0.14

      - name: Remove stale build outputs
        shell: bash
        run: |
          dotnet clean Orbita.slnx --configuration Release
          find . -type d -name bin -prune -exec rm -rf '{}' +
          find . -type d -name obj -prune -exec rm -rf '{}' +

      - name: Restore solution
        run: dotnet restore Orbita.slnx

      - name: Remove historical migration lineage
        shell: bash
        run: |
          find sources/back/Orbita.Persistence/Migrations -maxdepth 1 -type f -name '*.cs' -delete
          if find sources/back/Orbita.Persistence -type f -name '*ModelSnapshot.cs' -print -quit | grep -q .; then
            echo "A model snapshot remains after migration cleanup."
            find sources/back/Orbita.Persistence -type f -name '*ModelSnapshot.cs' -print
            exit 1
          fi
          dotnet ef migrations list \
            --project sources/back/Orbita.Persistence \
            --startup-project sources/back/Orbita.API \
            --context ApplicationDbContext

      - name: Generate clean initial migration from the current model
        run: |
          dotnet ef migrations add InitialOrbitaSchema \
            --project sources/back/Orbita.Persistence \
            --startup-project sources/back/Orbita.API \
            --context ApplicationDbContext \
            --output-dir Migrations

      - name: Verify migration is a clean baseline
        shell: bash
        run: |
          migration_file="$(find sources/back/Orbita.Persistence/Migrations -maxdepth 1 -type f -name '*_InitialOrbitaSchema.cs' -print -quit)"
          test -n "$migration_file"
          if grep -E 'DropTable|DropColumn|RenameTable|RenameColumn' "$migration_file"; then
            echo "A clean initial migration must not drop or rename historical schema objects."
            exit 1
          fi
          test "$(find sources/back/Orbita.Persistence/Migrations -maxdepth 1 -type f -name '*.cs' | wc -l)" -eq 3

      - name: Verify EF model snapshot
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project sources/back/Orbita.Persistence \
            --startup-project sources/back/Orbita.API \
            --context ApplicationDbContext

      - name: Build Release
        run: dotnet build Orbita.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test Tests/Orbita.Testing.Unit/Orbita.Testing.Unit.csproj --configuration Release --no-build --no-restore

      - name: Run PostgreSQL integration tests
        run: dotnet test Tests/Orbita.Testing.Integration/Orbita.Testing.Integration.csproj --configuration Release --no-build --no-restore

      - name: Run architecture tests
        run: dotnet test Tests/Orbita.Testing/Orbita.Testing.csproj --configuration Release --no-build --no-restore

      - name: Run architectural tribunals
        run: dotnet test Tests/Orbita.Testing.ArchitecturalReports/Orbita.Testing.ArchitecturalReports.csproj --configuration Release --no-build --no-restore

      - name: Commit generated migration and remove one-off workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/regenerate-clean-postgresql-baseline.yml
          git add sources/back/Orbita.Persistence/Migrations
          git commit -m "[Fix][Persistence]: reset clean schema baseline" \
            -m "- Generate the initial migration from the current EF model.\n- Remove Magellan migration history from Orbita's schema lineage."
          git push origin "HEAD:${GITHUB_REF_NAME}"
